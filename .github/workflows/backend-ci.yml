name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/migrations/**"

jobs:
  test:
    name: Backend Lint, Test & Migration Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint & Format Checks
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SUPABASE_URL: https://mock-ci.supabase.co
          SUPABASE_ANON_KEY: mock-ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-ci-service-role-key
          SUPABASE_JWT_AUDIENCE: authenticated
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          pytest -v --cov=app --cov-report=term-missing

      - name: Validate SQL Migrations Syntax
        working-directory: .
        run: |
          echo "Validating SQL migration files exist and are not empty..."
          for file in supabase/migrations/*.sql; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            test -s "$file" || (echo "Empty migration file: $file" && exit 1)
          done
          echo "Migration files validation passed!"
